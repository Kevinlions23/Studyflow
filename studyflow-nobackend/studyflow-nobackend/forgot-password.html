<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot password — StudyFlow AI</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="auth.css" />
</head>
<body class="auth-bg" data-page="forgot">
    <main class="auth-wrap">
        <section class="auth-card card">
            <div class="auth-header">
                <div class="brand">StudyFlow AI</div>
                <p class="tagline muted mt-8">Reset your password</p>
            </div>
            <p class="muted mt-8">Enter your email and we'll send you a reset link.</p>
            <form id="forgot-form" class="mt-16" novalidate>
                <div class="field">
                    <label for="email">Email</label>
                    <input id="email" type="email" autocomplete="email" required />
                </div>
                <button type="submit" class="btn btn-primary btn-block">Send reset link</button>
            </form>
            <p class="auth-footer muted">Remembered it? <a href="login.html">Back to login</a></p>
        </section>
    </main>
    <script type="module" src="auth.js"></script>
</body>
</html>
