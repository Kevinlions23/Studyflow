<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Library — StudyFlow AI</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="dashboard.css" />
</head>
<body>
    <div class="app-shell">
        <aside class="app-sidebar">
            <div class="brand">StudyFlow AI</div>
            <nav class="mt-24">
                <a class="nav-link" href="dashboard.html">Dashboard</a>
                <a class="nav-link active" href="library.html">My Library</a>
                <a class="nav-link" href="upload-book.html">Upload a Book</a>
                <a class="nav-link" href="settings.html">Settings</a>
            </nav>
            <div class="sidebar-footer">
                <button id="theme-toggle" type="button" class="btn btn-ghost btn-block">Toggle theme</button>
                <button id="logout-btn" type="button" class="btn btn-danger btn-block mt-8">Log out</button>
            </div>
        </aside>

        <div class="app-main">
            <header class="app-topbar spread">
                <div>
                    <h1>My Library</h1>
                    <p class="muted">All your uploaded books.</p>
                </div>
                <a class="btn btn-primary" href="upload-book.html">+ Upload a Book</a>
            </header>
            <main class="app-content">
                <div id="library-grid" class="books-grid"></div>
            </main>
        </div>
    </div>
    <script type="module" src="library.js"></script>
</body>
</html>
