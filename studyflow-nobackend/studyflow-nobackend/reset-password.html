<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Set new password — StudyFlow AI</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="auth.css" />
</head>
<body class="auth-bg" data-page="reset">
    <main class="auth-wrap">
        <section class="auth-card card">
            <div class="auth-header">
                <div class="brand">StudyFlow AI</div>
                <p class="tagline muted mt-8">Choose a new password</p>
            </div>
            <form id="reset-form" class="mt-16" novalidate>
                <div class="field">
                    <label for="password">New password</label>
                    <input id="password" type="password" autocomplete="new-password" required />
                    <p class="password-hint muted">At least 8 characters.</p>
                </div>
                <div class="field">
                    <label for="confirmPassword">Confirm new password</label>
                    <input id="confirmPassword" type="password" autocomplete="new-password" required />
                </div>
                <button type="submit" class="btn btn-primary btn-block">Update password</button>
            </form>
            <p class="auth-footer muted"><a href="login.html">Back to login</a></p>
        </section>
    </main>
    <script type="module" src="auth.js"></script>
</body>
</html>
